trigger:
  branches:
    include:
    - main

pr:
  branches:
    include:
    - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: global-variables  # Optional: for shared variables

steps:
- checkout: self

- task: CmdLine@2
  displayName: 'Install CML'
  inputs:
    script: |
      npm install -g @dvcorg/cml

- task: CmdLine@2
  displayName: 'Install Packages'
  inputs:
    script: 'make install'

- task: CmdLine@2
  displayName: 'Format Code'
  inputs:
    script: 'make format'

- task: CmdLine@2
  displayName: 'Train Model'
  inputs:
    script: 'make train'

- task: CmdLine@2
  displayName: 'Evaluation'
  inputs:
    script: 'make eval'
  env:
    REPO_TOKEN: $(System.AccessToken)  # Azure DevOps equivalent of GITHUB_TOKEN

- task: CmdLine@2
  displayName: 'Update Branch'
  inputs:
    script: 'make update-branch USER_NAME="$(USER_NAME)" USER_EMAIL="$(USER_EMAIL)"'
  env:
    NAME: $(USER_NAME)
    EMAIL: $(USER_EMAIL)