trigger: none
 
      #- main

pr:
  branches:
    include:
      - main

# Manual trigger also supported
# In Azure DevOps, "workflow_dispatch" equivalent is "Run Pipeline" button in UI.

pool:
  vmImage: 'ubuntu-latest'

steps:
  - checkout: self
    persistCredentials: true
    displayName: 'Checkout Repository'
  
  - script: |
      npm install -g @dvcorg/cml
    displayName: 'Install CML'

  - script: |
      make install
    displayName: 'Install Packages'

  - script: |
      make format
    displayName: 'Format Code'

  - script: |
      make train
    displayName: 'Train Model'

  - script: |
    env:
      REPO_TOKEN: $(GITHUB_TOKEN)
    displayName: 'Evaluation & Package Artifacts'
      make eval


  - script: |
    displayName: 'Update Branch'
    env:
      USER_NAME: $(USER_NAME)
      USER_EMAIL: $(USER_EMAIL)
      GITHUB_TOKEN: $(GITHUB_TOKEN)
      GITHUB_CONNECTION_USERNAME: $(GITHUB_CONNECTION_USERNAME)
      run: make update-branch USER_NAME=$USER_NAME USER_EMAIL=$USER_EMAIL


  - script: 
      ls -R output
    displayName: 'Verify packaged artifacts'

    
  - task: PublishPipelineArtifact@1
    inputs:
      pathToPublish: 'output'
      artifactName: 'ml-artifacts'
      publishLocation: 'Container'

    
