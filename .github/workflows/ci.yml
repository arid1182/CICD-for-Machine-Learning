trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

# Manual trigger also supported
# In Azure DevOps, "workflow_dispatch" equivalent is "Run Pipeline" button in UI.

pool:
  vmImage: 'ubuntu-latest'

steps:
  - checkout: self
    persistCredentials: true
    displayName: 'Checkout Repository'
  
  - script: |
      npm install -g @dvcorg/cml
    displayName: 'Install CML'

  - script: |
      make install
    displayName: 'Install Packages'

  - script: |
      make format
    displayName: 'Format Code'

  - script: |
      make train
    displayName: 'Train Model'

  - script: |
      make eval
      make package-artifacts
    displayName: 'Evaluation & Package Artifacts'
  
  - script: 
      ls -R output
    displayName: 'Verify packaged artifacts'

    
  - task: PublishPipelineArtifact@1
   displayName: 'Publishing the artifacts'
    inputs:
      pathToPublish: 'output'
      artifactName: 'ml-artifacts'
      publishLocation: 'Container'

    
