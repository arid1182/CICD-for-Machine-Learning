trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

steps:
  - task: Checkout@2
    displayName: 'Checkout Repository'

  - script: |
      make install
    displayName: 'Install Packages'

  - script: |
      make format
    displayName: 'Format Code'

  - script: |
      make train
    displayName: 'Train Model'

  - script: |
      make eval
    displayName: 'Evaluation'
    env:
      REPO_TOKEN: $(System.AccessToken)   # use DevOps system token

  - script: |
      make update-branch USER_NAME=$(USER_NAME) USER_EMAIL=$(USER_EMAIL)
    displayName: 'Update Branch'
    env:
      USER_NAME: $(USER_NAME)
      USER_EMAIL: $(USER_EMAIL)
