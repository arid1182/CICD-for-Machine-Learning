trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

# Manual trigger also supported
# In Azure DevOps, "workflow_dispatch" equivalent is "Run Pipeline" button in UI.

pool:
  vmImage: 'ubuntu-latest'

steps:
  - checkout: self
      persistCredentials: true
    displayName: 'Checkout Repository'
  
  - script: |
      npm install -g @dvcorg/cml
    displayName: 'Install CML'

  - script: |
      make install
    displayName: 'Install Packages'

  - script: |
      make format
    displayName: 'Format Code'

  - script: |
      make train
    displayName: 'Train Model'

  - script: |
      make eval
    displayName: 'Evaluation'
    env:
      REPO_TOKEN: $(System.AccessToken)   # Azure DevOps equivalent of GitHub Token

  - script: |
      make update-branch USER_NAME=$(USER_NAME) USER_EMAIL=$(USER_EMAIL)
    displayName: 'Update Branch'
    env:
      USER_NAME: $(USER_NAME)
      USER_EMAIL: $(USER_EMAIL)
