trigger:
  branches:
    include:
    - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  USER_NAME: '$(Build.RequestedFor)'
  USER_EMAIL: '$(Build.RequestedForEmail)'

steps:
- checkout: self
  persistCredentials: true

- script: |
    pip install dvc cml
  displayName: 'Install CML'

- script: 'make install'
  displayName: 'Install Packages'

- script: 'make format'
  displayName: 'Format Code'

- script: 'make train'
  displayName: 'Train Model'

- script: 'make eval'
  displayName: 'Evaluation'
  env:
    REPO_TOKEN: $(System.AccessToken)
    # ✅ CRITICAL: Set CML driver for Azure DevOps
    CML_DRIVER: azure
    CI: true

- script: |
    make update-branch USER_NAME="$(USER_NAME)" USER_EMAIL="$(USER_EMAIL)"
  displayName: 'Update Branch'
  condition: succeeded()